name: pujoroute
description: A new Flutter project for navigating Durga Puja in Kolkata.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^11.0.0
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.2
dev_dependencies:
  url_launcher_platform_interface: ^2.3.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
  # Bundled Outfit font (SIL OFL 1.1, see assets/fonts/OFL.txt) so no font is
  # downloaded at runtime (the app is fully offline).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
