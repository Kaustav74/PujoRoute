name: Build PujoRoute iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/ios/**"
      - "app/lib/**"
      - "app/pubspec.yaml"
      - ".github/workflows/build-ios.yml"

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Pub get
        run: flutter pub get
      - name: Generate iOS config
        run: flutter build ios --config-only --release
      - name: Build unsigned with xcodebuild
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
      - name: Package unsigned IPA
        run: |
          APP=$(find build/ios -name "Runner.app" -type d | head -1)
          echo "App at $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r PujoRoute-iOS-unsigned.ipa Payload
          ls -lh PujoRoute-iOS-unsigned.ipa
      - name: Publish to ios-ci release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-ci
          name: PujoRoute iOS — unsigned build
          prerelease: true
          body: |
            Unsigned iOS build of PujoRoute.

            This file cannot be installed by tapping it. iOS requires an Apple
            signature. To install on a device:
            1. Open the project in Xcode on a Mac (`app/ios/Runner.xcworkspace`).
            2. Sign in with your Apple ID under Signing & Capabilities.
            3. Select your iPhone and press Run.

            A paid Apple Developer account is required for TestFlight or the App Store.
          files: app/PujoRoute-iOS-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
