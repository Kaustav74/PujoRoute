name: Render FreeLLMAPI Health Keep-Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier web service sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping FreeLLMAPI Health Endpoint
        run: |
          echo "Pinging FreeLLMAPI health endpoint..."
          STATUS=$(curl -s --max-time 60 -o /dev/null -w "%{http_code}" https://my-freellmapi-server.onrender.com/health)
          echo "Health endpoint returned HTTP $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Health check returned non-200 status $STATUS"
            exit 1
          fi
