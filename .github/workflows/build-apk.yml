name: Build PujoRoute Android APK

on:
  push:
    branches: [main]
    paths:
      - "Android App/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pujoroute-android-apk
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Android App"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build universal Android APK
        run: |
          flutter build apk --release --dart-define=GEOAPIFY_API_KEY=bd63d62af74146b2b361a6e1d2cbf090
          flutter build apk --debug --dart-define=GEOAPIFY_API_KEY=bd63d62af74146b2b361a6e1d2cbf090

      - name: Rename APKs for distribution
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ../PujoRoute-Android-Testing.apk
          cp build/app/outputs/flutter-apk/app-debug.apk ../PujoRoute-Android-Debug.apk

      - name: Publish testing APK to rolling GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-ci
          name: PujoRoute Android — Latest CI Testing Build
          body: |
            Automated testing build from the latest successful main-branch workflow.

            ### Installation & Troubleshooting Notes:
            - **App is invalid / Package conflicts**: If your Android phone shows *"App not installed as package appears to be invalid"* or *"App is invalid"*, **uninstall any existing PujoRoute app from your phone first** before installing. Android prevents updating apps signed with differing development certificates.
            - **Play Protect**: If Google Play Protect warns about an unrecognized developer, tap **"More details"** and then **"Install anyway"**.
            - **Debug APK**: We provide both `PujoRoute-Android-Testing.apk` (release optimized) and `PujoRoute-Android-Debug.apk` (standard debug).
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            PujoRoute-Android-Testing.apk
            PujoRoute-Android-Debug.apk
